<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>
/* Cache-buster (mismo que ar-sales-production). GitHub Pages sirve el HTML con
   10 min de caché, así que sin esto un vendedor puede quedarse con la versión
   vieja del formulario después de un cambio. Se recarga UNA vez con marca de
   tiempo; la ventana de 30s evita que entre en bucle. La meta Cache-Control no
   sirve: el encabezado de GitHub le gana. */
(function(){try{
  var u=new URL(location.href);
  var t=parseInt(u.searchParams.get('_')||'0',36);
  if(!t || (Date.now()-t)>30000){
    u.searchParams.set('_', Date.now().toString(36));
    location.replace(u.toString());
  }
}catch(e){}})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Aplicaciones online — Auto Republic</title>
<link rel="stylesheet" href="estilo.css">
<style>
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  @media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr);}}
  .kpi{background:var(--gray-100);border-radius:12px;padding:14px;}
  .kpi .n{font-size:24px;font-weight:800;line-height:1;}
  .kpi .l{font-size:11px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.6px;margin-top:6px;font-weight:700;}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .filtros .field-input{max-width:260px;}
  .chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--gray-200);background:var(--gray-100);color:var(--gray-700);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;min-height:40px;}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .fila{background:#fff;border:1.5px solid var(--gray-200);border-radius:12px;padding:14px;margin-bottom:9px;cursor:pointer;transition:all .15s;}
  .fila:hover{border-color:var(--gray-300);box-shadow:var(--shadow);}
  .fila .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .fila .nom{font-size:16px;font-weight:700;letter-spacing:-.2px;}
  .fila .linea{font-size:12px;color:var(--gray-500);margin-top:3px;}
  .fila .cifras{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;}
  .fila .cif .n{font-size:15px;font-weight:700;}
  .fila .cif .l{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .det{margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-200);display:none;}
  .det.show{display:block;}
  .det .dato{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px;}
  .det .dato .k{color:var(--gray-500);} .det .dato .v{font-weight:600;text-align:right;}
  .det .notas{background:#fffbeb;border-left:3px solid var(--yellow);border-radius:8px;padding:11px;font-size:13px;line-height:1.5;margin-top:10px;white-space:pre-wrap;}
  .det .acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .bit{margin-top:14px;padding-top:12px;border-top:1px solid var(--gray-200);}
  .bit h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gray-500);margin-bottom:9px;display:flex;align-items:center;gap:7px;}
  .bit h4 .n{background:var(--gray-100);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--gray-700);}
  .bit-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--gray-100);}
  .bit-item:last-of-type{border-bottom:0;}
  .bit-ini{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .bit-cuerpo{flex:1;min-width:0;}
  .bit-meta{font-size:11px;color:var(--gray-400);font-weight:600;}
  .bit-meta b{color:var(--gray-700);font-weight:700;}
  .bit-texto{font-size:13.5px;line-height:1.5;color:var(--gray-900);margin-top:2px;white-space:pre-wrap;word-break:break-word;}
  .bit-nueva{display:flex;gap:8px;margin-top:10px;}
  .bit-nueva textarea{flex:1;min-height:44px;max-height:140px;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:9px;font-size:13.5px;font-family:inherit;background:var(--gray-100);resize:vertical;line-height:1.45;}
  .bit-nueva textarea:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.1);}
  .bit-vacia{font-size:12.5px;color:var(--gray-400);padding:4px 0 2px;}
  .det .acc .btn{padding:9px 15px;font-size:12px;min-height:40px;}
</style>
</head>
<body>
<div class="container" id="puerta" style="max-width:420px">
  <div class="header"><div><h1>Aplicaciones online</h1><div class="subtitle">Auto Republic</div></div></div>
  <div class="body">
    <div class="nota"><span>🔒</span><div>Aquí están los clientes con su teléfono. Pide el código al equipo.</div></div>
    <div class="field">
      <div class="field-label">Código</div>
      <input class="field-input" id="codigo" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar()" style="letter-spacing:2px">
    </div>
    <div id="puerta-error"></div>
    <div class="acciones"><button class="btn btn-primary" onclick="entrar()" id="btn-entrar">Entrar</button></div>
  </div>
</div>

<div class="container wide" id="panel" style="display:none">
  <div class="header">
    <div>
      <h1>Aplicaciones online</h1>
      <div class="subtitle" id="sub">Cargando…</div>
    </div>
    <a href="index.html">+ Nueva aplicación</a>
  </div>
  <div class="body">
    <div class="kpis" id="kpis"></div>
    <div class="filtros">
      <input class="field-input" id="buscar" placeholder="Buscar por cliente, teléfono o vendedor...">
      <button class="chip on" data-f="todas">Todas</button>
      <button class="chip" data-f="hoy">Compran ya</button>
      <button class="chip" data-f="nueva">Sin tocar</button>
      <button class="chip" data-f="trabajando">Trabajándolas</button>
      <button class="chip" data-f="sincopia">Sin copia ✉</button>
    </div>
    <div id="lista"><div class="cargando">Cargando…</div></div>
  </div>
</div>
<script src="shared.js"></script>
<script>
let TODAS = [], FILTRO = 'todas', BUSCA = '', ABIERTA = null, CODIGO = '';
/* Si la copia al vendedor no salió, tiene que verse aquí. Un correo que falla no
   puede quedarse solo en la pantalla del vendedor, que quizá ni lo leyó. */
const COPIA_MAL = {
  dado_de_baja: 'ese correo pidió no recibir mensajes de AR — que use otro',
  correo_rechazado: 'el correo fue rechazado',
  sin_contacto: 'no se pudo crear su contacto',
  error: 'falló el envío'
};
const GUARDA = 'ar_oa_codigo';

async function entrar(){
  const c = (document.getElementById('codigo').value || '').trim();
  const btn = document.getElementById('btn-entrar');
  if (!c) return;
  btn.disabled = true; btn.textContent = 'Entrando…';
  const n = await rpc('ar_oa_conteo', { p_codigo: c }).catch(() => null);
  btn.disabled = false; btn.textContent = 'Entrar';
  if (typeof n !== 'number') return errorPuerta('No se pudo conectar. Revisa el internet.');
  if (n < 0){ try{ localStorage.removeItem(GUARDA); }catch(e){} return errorPuerta('Ese código no es.'); }
  CODIGO = c;
  try{ localStorage.setItem(GUARDA, c); }catch(e){}
  document.getElementById('puerta').style.display = 'none';
  document.getElementById('panel').style.display = '';
  await cargar();
}
function errorPuerta(msg){
  document.getElementById('puerta-error').innerHTML = `<div class="nota warn"><span>⚠️</span><div>${esc(msg)}</div></div>`;
}
async function cargar(){
  const filas = await rpc('ar_oa_todas', { p_codigo: CODIGO }).catch(() => null);
  if (Array.isArray(filas)) { TODAS = filas; pintar(); }
}

function visibles(){
  const q = BUSCA.toLowerCase().trim();
  return TODAS.filter(a => {
    if (FILTRO === 'hoy' && !(a.urgencia === 'hoy' || a.urgencia === '2-3dias')) return false;
    if (FILTRO === 'nueva' && a.estado !== 'nueva') return false;
    if (FILTRO === 'trabajando' && a.estado !== 'trabajando') return false;
    if (FILTRO === 'sincopia' && !(a.copia_estado && a.copia_estado !== 'enviada')) return false;
    if (!q) return true;
    return [a.cliente_nombre, a.cliente_telefono, a.vendedor_nombre, a.vehiculo_especifico, a.notas]
      .some(x => String(x || '').toLowerCase().includes(q));
  });
}

function pintar(){
  const v = visibles();
  const hoyISO = new Date().toLocaleDateString('en-CA');
  const deHoy = TODAS.filter(a => String(a.created_at).slice(0,10) === hoyISO).length;
  const urgentes = TODAS.filter(a => a.urgencia === 'hoy' || a.urgencia === '2-3dias').length;
  const sinTocar = TODAS.filter(a => a.estado === 'nueva').length;
  document.getElementById('kpis').innerHTML =
    `<div class="kpi"><div class="n">${TODAS.length}</div><div class="l">En total</div></div>
     <div class="kpi"><div class="n">${deHoy}</div><div class="l">Entraron hoy</div></div>
     <div class="kpi"><div class="n" style="color:var(--red)">${urgentes}</div><div class="l">Compran ya</div></div>
     <div class="kpi"><div class="n" style="color:${sinTocar?'var(--yellow)':'inherit'}">${sinTocar}</div><div class="l">Sin tocar</div></div>`;
  document.getElementById('sub').textContent =
    TODAS.length ? `${v.length} de ${TODAS.length} · la última ${cuandoRelativo(TODAS[0].created_at)}` : 'Todavía no hay ninguna';

  document.getElementById('lista').innerHTML = v.length ? v.map(fila).join('')
    : `<div class="vacio">${TODAS.length ? 'Nada con ese filtro.' : 'Todavía no hay aplicaciones.<br>Cuando un vendedor mande la primera, aparece aquí sola.'}</div>`;
}

function fila(a){
  const urg = URGENCIA_COLOR[a.urgencia] || 'gris';
  const tipos = (a.tipo_carro || []).filter(t => t !== 'especifico').map(t => et('tipo_carro', t));
  if (a.vehiculo_especifico) tipos.push(a.vehiculo_especifico);
  const abierta = ABIERTA === a.id;
  return `
  <div class="fila" onclick="abrir('${a.id}')">
    <div class="top">
      <div>
        <div class="nom">${esc(a.cliente_nombre)}</div>
        <div class="linea">${esc(tel(a.cliente_telefono))} · ${esc(a.vendedor_nombre)}${a.location ? ' · ' + esc(a.location) : ''} · ${esc(cuandoRelativo(a.created_at))}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="badge b-${urg}">${esc(et('urgencia', a.urgencia))}</span>
        ${a.estado !== 'nueva' ? `<span class="badge b-azul">${esc(et('estado', a.estado))}</span>` : ''}
        ${(a.bitacora || []).length ? `<span class="badge b-gris" title="notas de Finance">✎ ${(a.bitacora || []).length}</span>` : ''}
        ${a.copia_estado && a.copia_estado !== 'enviada' ? `<span class="badge b-ambar" title="${esc(COPIA_MAL[a.copia_estado] || a.copia_estado)}">✉ no le llegó</span>` : ''}
      </div>
    </div>
    <div class="cifras">
      <div class="cif"><div class="n">${dinero(a.pago_mensual) || '—'}</div><div class="l">Mensual</div></div>
      <div class="cif"><div class="n">${dinero(a.down_hoy) || '—'}</div><div class="l">Down hoy</div></div>
      <div class="cif"><div class="n">${dinero(a.down_max) || '—'}</div><div class="l">Hasta</div></div>
      <div class="cif"><div class="n" style="font-size:13px;font-weight:600">${esc(et('trade_in', a.trade_in))}</div><div class="l">Trade-in</div></div>
    </div>
    <div class="det ${abierta?'show':''}" onclick="event.stopPropagation()">
      ${a.down_cuando ? `<div class="dato"><div class="k">¿Para cuándo tendría el down?</div><div class="v">${esc(a.down_cuando)}</div></div>` : ''}
      ${a.trade_in === 'debe' ? `
        <div class="dato"><div class="k">VIN del trade</div><div class="v">${esc(a.trade_vin || '—')}</div></div>
        <div class="dato"><div class="k">Millas</div><div class="v">${esc(millas(a.trade_millas) || '—')}</div></div>
        <div class="dato"><div class="k">Payoff</div><div class="v">${esc(dinero(a.trade_payoff) || '—')}</div></div>` : ''}
      <div class="dato"><div class="k">Puede venir</div><div class="v">${esc([fechaLarga(a.visita_fecha), a.visita_hora].filter(Boolean).join(' · ') || '—')}</div></div>
      <div class="dato"><div class="k">Busca</div><div class="v">${esc(tipos.join(' · ') || '—')}</div></div>
      <div class="dato"><div class="k">Co-buyer</div><div class="v">${esc(et('co_buyer', a.co_buyer))}</div></div>
      ${a.notas ? `<div class="notas">${esc(a.notas)}</div>` : ''}
      ${a.copia_estado && a.copia_estado !== 'enviada'
        ? `<div class="notas" style="background:#fffbeb;border-left-color:var(--yellow)"><b>La copia no le llegó a ${esc(a.vendedor_nombre)}</b> (${esc(a.vendedor_email)}) — ${esc(COPIA_MAL[a.copia_estado] || a.copia_estado)}. El link de arriba sí sirve para pasárselo.</div>`
        : ''}
      ${bitacora(a)}
      <div class="acc">
        <a class="btn btn-ghost" style="text-decoration:none;display:inline-block" href="tel:${esc(String(a.cliente_telefono).replace(/\D/g,''))}">Llamar</a>
        <button class="btn btn-ghost" onclick="copiar('${a.codigo || a.id}', this)">Copiar link</button>
        <a class="btn btn-ghost" style="text-decoration:none;display:inline-block" href="${a.codigo ? a.codigo : 'a.html?id=' + a.id}" target="_blank">Abrir link</a>
        ${['nueva','trabajando','esperando','cerrada'].filter(e => e !== a.estado)
          .map(e => `<button class="btn btn-ghost" onclick="marcar('${a.id}','${e}')">${esc(et('estado', e))}</button>`).join('')}
      </div>
    </div>
  </div>`;
}

/* Las notas son INTERNAS: se ven aquí, nunca en el link que se le pasa a Finance
   por mensaje. Ese link no tiene clave y podría terminar donde el cliente. */
function bitacora(a){
  const b = Array.isArray(a.bitacora) ? a.bitacora : [];
  const items = b.map(n => `
    <div class="bit-item">
      <div class="bit-ini">${esc(bitIniciales(n.quien))}</div>
      <div class="bit-cuerpo">
        <div class="bit-meta"><b>${esc(n.quien || 'Finance')}</b> · ${esc(bitCuando(n.cuando))}</div>
        <div class="bit-texto">${esc(n.texto)}</div>
      </div>
    </div>`).join('');
  return `<div class="bit">
    <h4>Notas de Finance ${b.length ? `<span class="n">${b.length}</span>` : ''}</h4>
    ${items || '<div class="bit-vacia">Todavía nadie ha escrito nada.</div>'}
    <div class="bit-nueva">
      <textarea id="nota-${a.id}" placeholder="Ej: crédito 400, no hay nada — pedir co-signer" onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey))agregarNota('${a.id}')"></textarea>
      <button class="btn btn-primary" style="flex:0 0 auto;min-width:0;padding:10px 16px;font-size:13px" onclick="agregarNota('${a.id}')">Agregar</button>
    </div>
  </div>`;
}

async function agregarNota(id){
  const ta = document.getElementById('nota-' + id);
  const texto = (ta.value || '').trim();
  if (!texto) return;
  const quien = await quienEscribe();
  if (!quien) return;
  const btn = ta.parentElement.querySelector('button');
  btn.disabled = true; btn.textContent = '…';
  // Se pinta primero para que no se sienta lento; si falla, se deshace.
  const a = TODAS.find(x => x.id === id);
  const antes = Array.isArray(a.bitacora) ? a.bitacora.slice() : [];
  a.bitacora = antes.concat([{ quien, texto, cuando: new Date().toISOString() }]);
  ta.value = ''; pintar();
  try{
    const r = await rpc('ar_oa_nota', { p_codigo: CODIGO, p_id: id, p_quien: quien, p_texto: texto });
    if (!Array.isArray(r) || !r.length) throw new Error('no se guardó');
    a.bitacora = r[0].bitacora || a.bitacora;
    pintar();
  }catch(e){
    a.bitacora = antes; pintar();
    alert('No se pudo guardar la nota. Revisa el internet — el texto sigue abajo.');
    const t2 = document.getElementById('nota-' + id); if (t2) t2.value = texto;
  }
}

/* Quién escribe. Se pregunta UNA vez por teléfono y queda guardado, igual que el
   nombre del vendedor en el formulario. Sin esto todas las notas dirían "Finance"
   y no se sabría quién dijo qué, que es justo lo que se quiere saber. */
const QUIEN = 'ar_oa_quien';
async function quienEscribe(){
  let q = ''; try{ q = localStorage.getItem(QUIEN) || ''; }catch(e){}
  if (q) return q;
  q = (prompt('¿Quién eres? (tu nombre queda en cada nota)') || '').trim();
  if (!q) return null;
  try{ localStorage.setItem(QUIEN, q); }catch(e){}
  return q;
}

function abrir(id){ ABIERTA = ABIERTA === id ? null : id; pintar(); }
function copiar(id, btn){
  const url = linkPublico(id);
  const ok = () => { btn.textContent = 'Copiado ✓'; setTimeout(() => btn.textContent = 'Copiar link', 1800); };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(ok).catch(ok); else ok();
}
async function marcar(id, estado){
  const a = TODAS.find(x => x.id === id); if (!a) return;
  const antes = a.estado; a.estado = estado; pintar();
  try{
    const rows = await rpc('ar_oa_estado', { p_codigo: CODIGO, p_id: id, p_estado: estado });
    if (!Array.isArray(rows) || !rows.length) throw new Error('no se guardó');
  }catch(e){ a.estado = antes; pintar(); alert('No se pudo guardar el cambio. Revisa el internet.'); }
}
document.getElementById('buscar').addEventListener('input', e => { BUSCA = e.target.value; pintar(); });
document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on'); FILTRO = c.dataset.f; pintar();
});
(function(){
  let g = ''; try{ g = localStorage.getItem(GUARDA) || ''; }catch(e){}
  if (g){ document.getElementById('codigo').value = g; entrar(); }
})();
</script>
</body>
</html>
