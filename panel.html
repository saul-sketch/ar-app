<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>
/* Cache-buster (mismo que ar-sales-production). GitHub Pages sirve el HTML con
   10 min de caché, así que sin esto un vendedor puede quedarse con la versión
   vieja del formulario después de un cambio. Se recarga UNA vez con marca de
   tiempo; la ventana de 30s evita que entre en bucle. La meta Cache-Control no
   sirve: el encabezado de GitHub le gana. */
(function(){try{
  var u=new URL(location.href);
  var t=parseInt(u.searchParams.get('_')||'0',36);
  if(!t || (Date.now()-t)>30000){
    u.searchParams.set('_', Date.now().toString(36));
    location.replace(u.toString());
  }
}catch(e){}})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Aplicaciones online — Auto Republic</title>
<link rel="stylesheet" href="estilo.css">
<style>
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  @media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr);}}
  .kpi{background:var(--gray-100);border-radius:12px;padding:14px;}
  .kpi .n{font-size:24px;font-weight:800;line-height:1;}
  .kpi .l{font-size:11px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.6px;margin-top:6px;font-weight:700;}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .filtros .field-input{max-width:260px;}
  /* Los botones apagados van SIN borde: son 17 en pantalla y cada borde era una línea
     más compitiendo por atención. Peso visual solo para el que está puesto. */
  .chip{padding:8px 14px;border-radius:999px;border:1.5px solid transparent;background:var(--gray-100);color:var(--gray-600);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;min-height:38px;transition:background .12s,color .12s;}
  .chip:hover{background:var(--gray-200);color:var(--gray-900);}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .chip.on:hover{background:var(--gray-800);color:#fff;}

  /* Buscar: primero y a todo el ancho. */
  .buscador{position:relative;display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .buscador svg{position:absolute;left:13px;width:17px;height:17px;fill:none;stroke:var(--gray-400);stroke-width:2;stroke-linecap:round;pointer-events:none;}
  .buscador input{flex:1;min-width:0;padding:12px 14px 12px 38px;border:1.5px solid var(--gray-200);border-radius:11px;
                  font-size:14px;font-family:inherit;background:#fff;color:var(--gray-900);min-height:44px;transition:border-color .15s,box-shadow .15s;}
  .buscador input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12);}
  .buscador input::placeholder{color:var(--gray-400);}
  .buscador button{flex:none;padding:0 14px;height:44px;border-radius:11px;border:1.5px solid var(--gray-200);
                   background:#fff;color:var(--gray-500);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .buscador button:hover{border-color:var(--gray-300);color:var(--gray-900);}

  /* Los filtros como UN bloque, no como tres filas sueltas flotando. */
  .fbox{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:14px;padding:6px 14px;margin-bottom:16px;}
  .frow{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--gray-200);}
  .frow:last-child{border-bottom:0;}
  .frow .ftit{flex:none;width:74px;padding-top:11px;margin:0;text-align:right;}
  .fchips{display:flex;flex-wrap:wrap;gap:7px;flex:1;min-width:0;align-items:center;}

  /* El rango como un solo control: dos recuadros sueltos se leían como dos filtros. */
  .rango{display:inline-flex;align-items:center;gap:2px;margin-left:6px;padding:0 8px;height:38px;
         background:#fff;border:1.5px solid var(--gray-200);border-radius:999px;}
  .rango input{width:46px;border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:600;
               color:var(--gray-900);text-align:center;padding:0;min-height:0;}
  .rango input:focus{outline:none;}
  .rango input::placeholder{color:var(--gray-400);font-weight:500;}
  .rango i{color:var(--gray-400);font-style:normal;font-size:13px;}
  .rango:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12);}
  .fila{background:#fff;border:1.5px solid var(--gray-200);border-radius:12px;padding:14px;margin-bottom:9px;cursor:pointer;transition:all .15s;}
  .fila:hover{border-color:var(--gray-300);box-shadow:var(--shadow);}
  .fila .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .fila .nom{font-size:16px;font-weight:700;letter-spacing:-.2px;}
  .fila .linea{font-size:12px;color:var(--gray-500);margin-top:3px;}
  .fila .cifras{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;}
  .fila .cif .n{font-size:15px;font-weight:700;}
  .fila .cif .l{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .det{margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-200);display:none;}
  .det.show{display:block;}
  .det .dato{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px;}
  .det .dato .k{color:var(--gray-500);} .det .dato .v{font-weight:600;text-align:right;}
  .det .notas{background:#fffbeb;border-left:3px solid var(--yellow);border-radius:8px;padding:11px;font-size:13px;line-height:1.5;margin-top:10px;white-space:pre-wrap;}
  .det .acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .btn-fuera{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:9px;padding:8px 14px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .btn-fuera:hover{background:rgba(255,255,255,.22);}
  .menu{position:relative;}
  .menu-btn{display:flex;align-items:center;gap:9px;background:var(--gray-100);border:1.5px solid var(--gray-200);border-radius:10px;padding:8px 13px;min-height:44px;cursor:pointer;font-family:inherit;transition:all .15s;max-width:260px;}
  .menu-btn:hover{border-color:var(--gray-300);background:var(--gray-200);}
  .menu-btn.puesto{background:var(--primary);border-color:var(--primary);}
  .menu-btn.puesto .menu-tit{color:rgba(255,255,255,.6);}
  .menu-btn.puesto .menu-val,.menu-btn.puesto .menu-flecha{color:#fff;}
  .menu-tit{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gray-400);}
  .menu-val{font-size:13.5px;font-weight:700;color:var(--gray-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
  .menu-flecha{font-size:11px;color:var(--gray-400);margin-left:auto;}
  .menu-lista{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:#fff;border:1.5px solid var(--gray-200);border-radius:12px;box-shadow:var(--shadow-lg);padding:5px;min-width:230px;max-height:320px;overflow-y:auto;}
  .menu-lista.abierta{display:block;animation:fade .15s ease;}
  .menu-op{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px 11px;font-size:13.5px;font-family:inherit;color:var(--gray-700);cursor:pointer;min-height:40px;}
  .menu-op:hover{background:var(--gray-100);}
  .menu-op.on{background:var(--primary);color:#fff;font-weight:700;}
  .menu-n{font-size:11px;font-weight:700;opacity:.5;}
  .menu-buscar{width:100%;padding:10px 11px;margin-bottom:4px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:13.5px;font-family:inherit;background:var(--gray-100);min-height:40px;}
  .menu-buscar:focus{outline:none;border-color:var(--blue);background:#fff;}
  .aviso-nuevas{display:block;width:100%;background:var(--primary);color:#fff;border:0;border-radius:11px;padding:12px 16px;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:14px;text-align:left;animation:fade .25s ease;}
  .aviso-nuevas:hover{background:#000;}
  #banda{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  #banda:empty{display:none;}
  .banda-b{display:block;width:100%;text-align:left;border:0;border-radius:11px;padding:13px 16px;font-size:14px;font-family:inherit;cursor:pointer;transition:all .15s;line-height:1.4;}
  .banda-b b{font-weight:800;}
  .banda-b.rojo{background:#fee2e2;color:#991b1b;border-left:4px solid var(--red);}
  .banda-b.rojo:hover{background:#fecaca;}
  .banda-b.azul{background:#dbeafe;color:#1e40af;border-left:4px solid var(--blue);}
  .banda-b.azul:hover{background:#bfdbfe;}

  /* En el celular los filtros ocupaban toda la pantalla antes de la primera tarjeta.
     Se pliegan detrás de un boton: lo que importa es la lista, no los controles. */
  .filtros-tog{display:none;}
  @media(max-width:620px){
    .filtros-tog{display:block;width:100%;background:var(--gray-100);border:1.5px solid var(--gray-200);border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;font-family:inherit;color:var(--gray-700);cursor:pointer;min-height:44px;margin-bottom:10px;text-align:left;}
    #filtros-caja{display:none;}
    #filtros-caja.abierta{display:block;}
    .kpis{grid-template-columns:repeat(2,1fr);}
    /* En pantalla chica la columna de etiquetas robaba el ancho de los botones:
       pasa arriba de cada grupo. */
    .frow{flex-direction:column;gap:7px;}
    .frow .ftit{width:auto;text-align:left;padding-top:0;}
    .fbox{padding:4px 12px;}
  }
  .kpi-sub{font-size:11px;color:var(--gray-400);margin-top:5px;font-weight:600;}
  .sect2{margin-top:26px;}
  .sect2 h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--gray-500);margin-bottom:8px;}
  .kpi-hint{font-size:13px;color:var(--gray-700);margin-bottom:12px;line-height:1.5;}
  .kpi-hint b{color:var(--gray-900);}
  .tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1.5px solid var(--gray-200);border-radius:12px;}
  .tabla{width:100%;border-collapse:collapse;min-width:520px;}
  .tabla th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--gray-400);text-align:center;padding:11px 10px;background:var(--gray-100);white-space:nowrap;}
  .tabla th:first-child{text-align:left;}
  .tabla td{font-size:13.5px;text-align:center;padding:11px 10px;border-top:1px solid var(--gray-100);white-space:nowrap;}
  .tabla td.nom2{text-align:left;font-weight:700;color:var(--gray-900);}
  .tabla tbody tr:hover{background:var(--gray-100);}
  .barras{display:flex;flex-direction:column;gap:7px;}
  .barra{display:flex;align-items:center;gap:10px;}
  .barra-t{font-size:12.5px;color:var(--gray-700);flex:0 0 96px;}
  .barra-p{flex:1;height:9px;background:var(--gray-100);border-radius:999px;overflow:hidden;}
  .barra-p div{height:100%;border-radius:999px;transition:width .3s ease;}
  .barra-n{font-size:12.5px;font-weight:700;flex:0 0 26px;text-align:right;}
  .menu-nada{padding:12px 11px;font-size:13px;color:var(--gray-400);}
  @media(max-width:520px){ .menu{flex:1 1 100%;} .menu-btn{max-width:none;width:100%;} .menu-lista{min-width:100%;} }
  .ftit{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gray-400);margin-right:2px;}
  .fila .ultima{margin-top:9px;padding:9px 11px;background:var(--gray-100);border-radius:9px;font-size:13px;line-height:1.45;color:var(--gray-700);}
  .fila .ultima b{color:var(--gray-900);}
  .verbox{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-200);flex-wrap:wrap;}
  .verbox .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gray-500);}
  .verbox .quien{font-size:11.5px;color:var(--gray-500);}
  .verbox .quien b{color:var(--gray-700);}
  .vbtn{padding:9px 14px;border-radius:9px;border:1.5px solid var(--gray-200);background:var(--gray-100);color:var(--gray-700);font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;min-height:40px;transition:all .15s;}
  .vbtn:hover{background:var(--gray-200);}
  .vbtn.on.verde{background:var(--green);border-color:var(--green);color:#fff;}
  .vbtn.on.ambar{background:var(--yellow);border-color:var(--yellow);color:#fff;}
  .vbtn.on.rojo{background:var(--red);border-color:var(--red);color:#fff;}
  .fila .deal{font-size:12px;font-weight:700;color:var(--blue);background:#dbeafe;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle;}
  .dealbox{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-200);flex-wrap:wrap;}
  .dealbox .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gray-500);}
  .dealbox .field-input{flex:1;min-width:120px;max-width:200px;padding:9px 11px;font-size:13.5px;min-height:40px;}
  .dealbox .btn{padding:9px 15px;font-size:12px;min-height:40px;}
  .dealbox .deal-ok{font-size:12px;font-weight:700;color:var(--green);}
  .bit{margin-top:14px;padding-top:12px;border-top:1px solid var(--gray-200);}
  .bit h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gray-500);margin-bottom:9px;display:flex;align-items:center;gap:7px;}
  .bit h4 .n{background:var(--gray-100);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--gray-700);}
  .bit-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--gray-100);}
  .bit-item:last-of-type{border-bottom:0;}
  .bit-ini{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .bit-cuerpo{flex:1;min-width:0;}
  .bit-meta{font-size:11px;color:var(--gray-400);font-weight:600;}
  .bit-meta b{color:var(--gray-700);font-weight:700;}
  .bit-texto{font-size:13.5px;line-height:1.5;color:var(--gray-900);margin-top:2px;white-space:pre-wrap;word-break:break-word;}
  .bit-nueva{display:flex;gap:8px;margin-top:10px;}
  .bit-nueva textarea{flex:1;min-height:44px;max-height:140px;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:9px;font-size:13.5px;font-family:inherit;background:var(--gray-100);resize:vertical;line-height:1.45;}
  .bit-nueva textarea:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.1);}
  .bit-etapa{font-size:12px;color:var(--gray-500);padding:6px 0 6px 4px;border-bottom:1px solid var(--gray-100);}
  .bit-etapa b{color:var(--gray-700);}
  .bit-vacia{font-size:12.5px;color:var(--gray-400);padding:4px 0 2px;}
  .det .acc .btn{padding:9px 15px;font-size:12px;min-height:40px;}
</style>
</head>
<body>
<div class="container" id="puerta" style="max-width:420px">
  <div class="header"><div><h1>Aplicaciones online</h1><div class="subtitle">Auto Republic</div></div></div>
  <div class="body">
    <div class="nota"><span>🔒</span><div>Aquí están los clientes con su teléfono. Usa <strong>tu</strong> código — las notas que escribas quedan con tu nombre.</div></div>
    <div class="field">
      <div class="field-label">Tu código</div>
      <input class="field-input" id="codigo" type="password" placeholder="NOMBRE-XXXX" autocapitalize="characters" onkeydown="if(event.key==='Enter')entrar()" style="letter-spacing:1px">
    </div>
    <div id="puerta-error"></div>
    <div class="acciones"><button class="btn btn-primary" onclick="entrar()" id="btn-entrar">Entrar</button></div>
  </div>
</div>

<!-- Lo que ve un VENDEDOR que entra desde el menú del CRM: solo lo suyo, para
     saber si ya se la revisaron y qué dijeron, sin preguntarle al manager. -->
<div class="container" id="vista-mia" style="display:none;max-width:780px">
  <div class="header">
    <div>
      <h1>Mis aplicaciones</h1>
      <div class="subtitle" id="mia-sub">—</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button onclick="abrirFuera(this)" class="btn-fuera" title="Abrir en el navegador, ya identificado">↗ Abrir fuera</button>
      <a href="index.html" id="mia-nueva">+ Nueva aplicación</a>
    </div>
  </div>
  <div class="body">
    <div class="kpis" id="mia-kpis"></div>
    <div id="mia-lista"></div>
  </div>
</div>

<div class="container wide" id="panel" style="display:none">
  <div class="header">
    <div>
      <h1>Aplicaciones online</h1>
      <div class="subtitle" id="sub">Cargando…</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span id="yo" style="font-size:12px;color:rgba(255,255,255,.75);font-weight:600"></span>
      <a href="index.html">+ Nueva aplicación</a>
    </div>
  </div>
  <div class="body">
    <div id="banda"></div>
    <div class="kpis" id="kpis"></div>
    <div class="filtros" style="margin-bottom:8px">
      <div class="menu" id="menu-tienda"></div>
      <div class="menu" id="menu-vendedor"></div>
      <button class="chip" onclick="verKpis()" id="chip-kpis" style="margin-left:auto">📊 KPIs</button>
      <button class="chip" onclick="abrirFuera(this)">↗ Abrir fuera del CRM</button>
      <button class="chip" onclick="salir()" id="chip-salir" style="color:var(--gray-500)">Salir</button>
    </div>
    <!-- Cada fila filtra UNA cosa y las tres se combinan. Antes estaban revueltas en
         una sola fila exclusiva: elegir "Sin tocar" (que mira la etapa) dejaba ver una
         que ya estaba Negada, porque su etapa seguia en nueva. Las etiquetas que se
         ven en la tarjeta y los botones de filtrar dicen ahora exactamente lo mismo. -->
    <button class="filtros-tog" onclick="const c=document.getElementById('filtros-caja');c.classList.toggle('abierta');this.textContent=(c.classList.contains('abierta')?'▴ Ocultar filtros':'▾ Filtros y búsqueda')">▾ Filtros y búsqueda</button>
    <div id="filtros-caja">
      <!-- Buscar va primero y ocupa el ancho: cuando uno sabe a quién busca, es el
           camino más corto. Los filtros son para explorar; la búsqueda para llegar. -->
      <div class="buscador">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="buscar" placeholder="Nombre, teléfono, Deal #, vendedor o algo de una nota…">
        <button id="chip-limpiar" onclick="limpiarFiltros()" style="display:none">Quitar filtros</button>
      </div>
      <!-- Cada fila filtra UNA cosa y las tres se cruzan. La etiqueta va en una columna
           de ancho fijo para que todos los botones arranquen en la misma línea: sin eso
           las filas quedaban desalineadas y el bloque se leía como un amontonamiento. -->
      <div class="fbox">
        <div class="frow">
          <span class="ftit">Veredicto</span>
          <div class="fchips">
            <button class="chip on" data-v="todas">Todas</button>
            <button class="chip" data-v="sinrevisar">Sin revisar</button>
            <button class="chip" data-v="aprobado">Aprobadas</button>
            <button class="chip" data-v="posible">Con posibilidad</button>
            <button class="chip" data-v="negado">Negadas</button>
          </div>
        </div>
        <div class="frow">
          <span class="ftit">Etapa</span>
          <div class="fchips">
            <button class="chip on" data-f="todas">Todas</button>
            <button class="chip" data-f="hoy">Compran ya</button>
            <button class="chip" data-f="trabajando">Trabajándolas</button>
            <button class="chip" data-f="esperando">Esperando</button>
            <button class="chip" data-f="cerrada">Cerradas</button>
            <button class="chip" data-f="sincopia">Sin copia ✉</button>
          </div>
        </div>
        <div class="frow">
          <span class="ftit">FICO</span>
          <div class="fchips">
            <button class="chip on" data-fi="todas">Todos</button>
            <button class="chip" data-fi="sin">Sin revisar</button>
            <button class="chip" data-fi="nohit">Sin puntaje</button>
            <button class="chip" data-fi="700">700+</button>
            <button class="chip" data-fi="650">650+</button>
            <button class="chip" data-fi="600">600+</button>
            <button class="chip" data-fi="550">550+</button>
            <span class="rango">
              <input id="fico-min" inputmode="numeric" placeholder="min">
              <i>–</i>
              <input id="fico-max" inputmode="numeric" placeholder="max">
            </span>
          </div>
        </div>
      </div>
    </div>
    <div id="lista"><div class="cargando">Cargando…</div></div>
    <div id="kpi-vista" style="display:none"></div>
  </div>
</div>
<script src="shared.js"></script>
<script>
let TODAS = [], FILTRO = 'todas', VER = 'todas', LOC = 'todas', VEND = 'todos', BUSCA = '', ABIERTA = null, CODIGO = '', QUIEN = '', CRM = null, SOLO_HOY = false;
/* Si la copia al vendedor no salió, tiene que verse aquí. Un correo que falla no
   puede quedarse solo en la pantalla del vendedor, que quizá ni lo leyó. */
/* Verde/ámbar/rojo: el veredicto es lo primero que hay que poder leer de un vistazo. */
const VER_COLOR = { aprobado:'verde', posible:'ambar', negado:'rojo', historico:'gris' };
const COPIA_MAL = {
  dado_de_baja: 'ese correo pidió no recibir mensajes de AR — que use otro',
  correo_rechazado: 'el correo fue rechazado',
  sin_contacto: 'no se pudo crear su contacto',
  error: 'falló el envío'
};
const GUARDA = 'ar_oa_codigo';

async function entrar(){
  const c = (document.getElementById('codigo').value || '').trim();
  const btn = document.getElementById('btn-entrar');
  if (!c) return;
  btn.disabled = true; btn.textContent = 'Entrando…';
  const nombre = await rpc('ar_oa_quien', { p_codigo: c }).catch(() => undefined);
  btn.disabled = false; btn.textContent = 'Entrar';
  if (nombre === undefined) return errorPuerta('No se pudo conectar. Revisa el internet.');
  if (!nombre){ try{ localStorage.removeItem(GUARDA); }catch(e){} return errorPuerta('Ese código no es. Pídele el tuyo a Saúl.'); }
  CODIGO = c; QUIEN = nombre;
  try{ localStorage.setItem(GUARDA, c); }catch(e){}
  document.getElementById('yo').textContent = nombre;
  document.getElementById('puerta').style.display = 'none';
  document.getElementById('panel').style.display = '';
  await cargar();
}
/* Abrir fuera del CRM sin volver a identificarse, pero sin dejar un link que sirva
   despues. Se pide un PASE de un solo uso: la pestaña nueva lo canjea, se queda con
   la sesión en ESE navegador, y borra el pase de la dirección. Copiar la barra del
   navegador no le sirve a nadie, y el pase muere a los 10 minutos si no se usa. */
async function abrirFuera(btn){
  const txt = btn.textContent;
  btn.disabled = true; btn.textContent = 'Abriendo…';
  // La pestaña se abre YA, antes de pedir el pase: si no, el navegador la bloquea
  // por abrirse "sola" fuera del clic.
  const w = window.open('', '_blank');
  try{
    const email  = (SESION && SESION.email)  || (CRM && CRM.email)  || '';
    const nombre = (SESION && SESION.nombre) || (CRM && CRM.nombre) || QUIEN || '';
    const t = await rpc('ar_oa_pase_crear', { p_codigo: CODIGO.startsWith('crm:') ? '' : CODIGO, p_email: email, p_nombre: nombre });
    if (!t) throw new Error('sin pase');
    w.location = base() + 'panel.html?p=' + encodeURIComponent(t);
  }catch(e){
    if (w) w.close();
    alert('No se pudo abrir fuera. Intenta otra vez.');
  }
  btn.disabled = false; btn.textContent = txt;
}

function salir(){
  try{ localStorage.removeItem(GUARDA); localStorage.removeItem(SESION_KEY); }catch(e){}
  location.replace(location.pathname);
}
function errorPuerta(msg){
  document.getElementById('puerta-error').innerHTML = `<div class="nota warn"><span>⚠️</span><div>${esc(msg)}</div></div>`;
}
async function cargar(){
  const filas = await rpc('ar_oa_todas', { p_codigo: CODIGO }).catch(() => null);
  if (Array.isArray(filas)) { TODAS = filas; ULTIMA = Date.now(); pintar(); }
}

/* ── Que se actualice sola ────────────────────────────────────────────────────
   El panel se queda abierto todo el día. Sin esto, un manager podía estar mirando
   una lista de hace dos horas creyendo que era lo de ahora.
   Lo delicado es NO interrumpir: si alguien está escribiendo una nota y la pantalla
   se vuelve a dibujar, pierde lo que llevaba. Se trae lo nuevo siempre, pero solo se
   redibuja cuando es seguro; si no, espera y avisa arriba. */
let ULTIMA = 0, PENDIENTE = null, TIMER = null;

function ocupado(){
  const f = document.activeElement;
  if (f && (f.tagName === 'TEXTAREA' || (f.tagName === 'INPUT' && f.id !== 'buscar'))) return true;
  if ([...document.querySelectorAll('.menu')].some(m => m.dataset.abierto === '1')) return true;
  return false;
}

/* Huella de los datos: si nada cambio, ni se toca la pantalla. La mayoria de los
   refrescos no traen nada nuevo, y no redibujar es la unica forma segura de no
   moverle nada a quien esta trabajando. */
function huella(filas){
  return filas.map(a => [a.id, a.estado, a.veredicto, a.deal_number, a.fico, a.fico_co, a.fico_txt, a.fico_co_txt, (a.docs||[]).length,
    (a.bitacora||[]).length, a.copia_estado, a.crm_contact_id].join('~')).join('|');
}

/* Redibujar sin sacarlo de donde estaba: se guarda a que altura esta y se devuelve
   ahi mismo. Si tiene una tarjeta abierta, se la deja donde estaba en pantalla, que
   es lo que de verdad se nota. */
function pintarSinMover(){
  const abierta = ABIERTA ? document.querySelector('.det.show') : null;
  const anclaAntes = abierta ? abierta.closest('.fila').getBoundingClientRect().top : null;
  const y = window.scrollY;
  pintar();
  if (anclaAntes !== null){
    const ahora = document.querySelector('.det.show');
    if (ahora){
      const d = ahora.closest('.fila').getBoundingClientRect().top - anclaAntes;
      window.scrollTo(0, window.scrollY + d);
      return;
    }
  }
  window.scrollTo(0, y);
}

async function refrescar(silencioso){
  if (!CODIGO) return;
  const filas = await rpc('ar_oa_todas', { p_codigo: CODIGO }).catch(() => null);
  if (!Array.isArray(filas)) return;
  ULTIMA = Date.now();
  // Nada cambio: no se toca la pantalla. Es el caso mas comun.
  if (huella(filas) === huella(TODAS)){ TODAS = filas; PENDIENTE = null; return; }
  if (!silencioso || !ocupado()){
    TODAS = filas; PENDIENTE = null;
    const av = document.getElementById('aviso-nuevas'); if (av) av.remove();
    pintarSinMover(); return;
  }
  // Estaba escribiendo: se guarda aparte y se avisa. No se le borra lo que iba haciendo.
  PENDIENTE = filas;
  const nuevas = filas.length - TODAS.length;
  avisoNuevas(nuevas > 0 ? nuevas : 0);
}

function avisoNuevas(n){
  let b = document.getElementById('aviso-nuevas');
  if (!b){
    b = document.createElement('button');
    b.id = 'aviso-nuevas'; b.className = 'aviso-nuevas';
    b.onclick = () => { if (PENDIENTE){ TODAS = PENDIENTE; PENDIENTE = null; } b.remove(); pintarSinMover(); };
    const cont = document.querySelector('#panel .body');
    if (cont) cont.prepend(b);
  }
  b.textContent = n === 0 ? 'Hay cambios nuevos — toca para verlos'
                : n === 1 ? '1 aplicación nueva — toca para verla'
                : n + ' aplicaciones nuevas — toca para verlas';
}

function arrancarRefresco(){
  if (TIMER) return;
  // Cada minuto. Más seguido no aporta: no entran aplicaciones cada 10 segundos.
  TIMER = setInterval(() => refrescar(true), 60000);
  // Y al volver a la pestaña, que es cuando de verdad quiere ver lo último.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - ULTIMA > 20000) refrescar(true);
  });
  window.addEventListener('focus', () => { if (Date.now() - ULTIMA > 20000) refrescar(true); });
}

/* La tienda es un filtro aparte de los de estado: elegir Orlando no debe borrar
   "compran ya". Y se aplica ANTES de los números de arriba, para que esos KPIs sean
   los de la tienda que estás mirando y no los de las dos juntas. */
function deLaTienda(){
  let base = TODAS;
  if (LOC === 'sin') base = base.filter(a => !a.location);
  else if (LOC !== 'todas') base = base.filter(a => a.location === LOC);
  // El vendedor se cruza por CORREO, no por nombre: el correo es el que no cambia.
  if (VEND !== 'todos') base = base.filter(a => (a.vendedor_email || '').toLowerCase() === VEND);
  return base;
}

/* Menú propio, no el del navegador: los nativos se ven distintos en cada teléfono y
   no combinan con el resto. Se cierra al elegir, al tocar afuera y con Escape. */
function menu(cont, titulo, opciones, valor, alElegir){
  const sel = opciones.find(o => o.v === valor) || opciones[0];
  const abierto = cont.dataset.abierto === '1';
  const filtro = (cont.dataset.filtro || '').toLowerCase();
  // El buscador aparece solo cuando la lista es larga; con 3 opciones estorba.
  const conBuscador = opciones.length > 8;
  // Buscar por el PRINCIPIO de cada palabra, no por cualquier letra suelta: escribir
  // "d" tiene que llevar a Diego, no traer a Anthony Calderon y Juviany Padron. Si
  // nada empieza así, se cae a buscar en cualquier parte para no dejarlo sin nada.
  const empieza = (t) => t.toLowerCase().split(/\s+/).some(p => p.startsWith(filtro));
  let vistas = opciones;
  if (filtro){
    const porPrincipio = opciones.filter((o,i) => i === 0 || empieza(o.t));
    vistas = porPrincipio.length > 1
      ? porPrincipio
      : opciones.filter((o,i) => i === 0 || o.t.toLowerCase().includes(filtro));
  }
  cont.innerHTML = `
    <button class="menu-btn ${valor !== opciones[0].v ? 'puesto' : ''}" type="button">
      <span class="menu-tit">${esc(titulo)}</span>
      <span class="menu-val">${esc(sel ? sel.t : '')}</span>
      <span class="menu-flecha">▾</span>
    </button>
    <div class="menu-lista ${abierto ? 'abierta' : ''}">
      ${conBuscador ? `<input class="menu-buscar" placeholder="Escribe una letra…" value="${esc(cont.dataset.filtro || '')}">` : ''}
      ${vistas.length > (conBuscador && filtro ? 1 : 0)
        ? vistas.map(o => `<button type="button" class="menu-op ${o.v === valor ? 'on' : ''}" data-v="${esc(o.v)}">
            <span>${esc(o.t)}</span>${o.n !== undefined ? `<span class="menu-n">${o.n}</span>` : ''}</button>`).join('')
        : '<div class="menu-nada">Nadie con esa letra</div>'}
    </div>`;
  cont.querySelector('.menu-btn').onclick = e => {
    e.stopPropagation();
    const y = cont.dataset.abierto === '1';
    document.querySelectorAll('.menu').forEach(m => { m.dataset.abierto = '0'; m.dataset.filtro = ''; });
    cont.dataset.abierto = y ? '0' : '1';
    pintar();
    if (!y){
      const b = cont.querySelector('.menu-buscar');
      // En el celular no se enfoca solo: el teclado taparía la lista de golpe.
      if (b && window.innerWidth > 620) b.focus();
    }
  };
  const b = cont.querySelector('.menu-buscar');
  if (b){
    b.onclick = e => e.stopPropagation();
    b.oninput = e => {
      cont.dataset.filtro = e.target.value;
      const pos = e.target.selectionStart;
      pintar();
      const nb = cont.querySelector('.menu-buscar');
      if (nb){ nb.focus(); nb.setSelectionRange(pos, pos); }
    };
    b.onkeydown = e => {
      e.stopPropagation();
      if (e.key === 'Enter'){
        const primera = cont.querySelector('.menu-op[data-v]:not([data-v="' + opciones[0].v + '"])');
        if (primera){ cont.dataset.abierto = '0'; cont.dataset.filtro = ''; ABIERTA = null; alElegir(primera.dataset.v); }
      }
      if (e.key === 'Escape'){ cont.dataset.abierto = '0'; cont.dataset.filtro = ''; pintar(); }
    };
  }
  cont.querySelectorAll('.menu-op').forEach(x => x.onclick = e => {
    e.stopPropagation(); cont.dataset.abierto = '0'; cont.dataset.filtro = ''; ABIERTA = null; alElegir(x.dataset.v);
  });
}
document.addEventListener('click', () => {
  if ([...document.querySelectorAll('.menu')].some(m => m.dataset.abierto === '1')){
    document.querySelectorAll('.menu').forEach(m => { m.dataset.abierto = '0'; m.dataset.filtro = ''; }); pintar();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ document.querySelectorAll('.menu').forEach(m => { m.dataset.abierto='0'; m.dataset.filtro=''; }); pintar(); }
});

/* La lista de vendedores se arma sola con quien haya sometido: no hay que mantenerla
   a mano y nadie se queda fuera cuando entra gente nueva. */
function pintarMenus(){
  const porTienda = {}, porVend = {};
  TODAS.forEach(a => {
    const t = a.location || 'sin'; porTienda[t] = (porTienda[t] || 0) + 1;
    const e = (a.vendedor_email || '').toLowerCase(); if (!e) return;
    (porVend[e] = porVend[e] || { n: 0, nombre: a.vendedor_nombre }).n++;
  });
  const opsT = [{ v:'todas', t:'Ambas tiendas', n: TODAS.length },
                { v:'Orlando', t:'Orlando', n: porTienda.Orlando || 0 },
                { v:'Kissimmee', t:'Kissimmee', n: porTienda.Kissimmee || 0 }];
  if (porTienda.sin) opsT.push({ v:'sin', t:'Sin tienda', n: porTienda.sin });
  menu(document.getElementById('menu-tienda'), 'Tienda', opsT, LOC, v => { LOC = v; pintar(); });

  // De la A a la Z: con 12 nombres es mas facil encontrar a alguien por su letra que
  // por cuantas lleva. 'es' para que la Ñ y los acentos queden donde deben.
  const opsV = [{ v:'todos', t:'Todos los vendedores', n: TODAS.length }].concat(
    Object.entries(porVend)
      .map(([e,x]) => ({ v:e, t:x.nombre, n:x.n }))
      .sort((a,b) => a.t.localeCompare(b.t, 'es', { sensitivity:'base' })));
  menu(document.getElementById('menu-vendedor'), 'Vendedor', opsV, VEND, v => { VEND = v; pintar(); });
}

/* Cuánto quema cada aplicación. Ordenar por fecha de llegada entierra lo que duele:
   la que dijo "compro HOY" y lleva 3 días esperando quedaba al fondo de la lista.
   Manda: primero quien viene al dealer hoy, después las urgentes sin revisar segun
   lo que llevan esperando, y de ultimo lo ya resuelto. */
const PESO_URG = { hoy: 4, '2-3dias': 3, semana: 2, mes: 1, sin_fecha: 0.5 };
function quema(a){
  const h = (Date.now() - new Date(a.created_at)) / 36e5;
  let p = 0;
  if (vieneHoy(a)) p += 10000;                       // lo de hoy va primero, siempre
  if (!a.veredicto) p += h * (PESO_URG[a.urgencia] || 1);
  else p -= 1000;                                    // ya resuelta: al final
  if (a.estado === 'cerrada') p -= 2000;
  return p;
}
function vieneHoy(a){
  if (!a.visita_fecha) return false;
  const hoy = new Date(); const f = String(a.visita_fecha).slice(0,10);
  return f === hoy.toLocaleDateString('en-CA') && a.estado !== 'cerrada';
}
function horasEsperando(a){ return (Date.now() - new Date(a.created_at)) / 36e5; }

let FICO = 'todas', FICO_MIN = null, FICO_MAX = null;
// El puntaje que manda para filtrar: el más alto entre signer y co-signer.
function mejorFico(a){
  const v = [a.fico, a.fico_co].filter(x => x != null).map(Number);
  return v.length ? Math.max(...v) : null;
}
// Ya le miraron el crédito, aunque el buró no haya devuelto puntaje ("no hit").
function ficoRevisado(a){ return mejorFico(a) != null || !!(a.fico_txt || a.fico_co_txt); }
function ficoSinPuntaje(a){ return mejorFico(a) == null && !!(a.fico_txt || a.fico_co_txt); }
// Lo que se muestra en el campo: el número, o la palabra que escribieron.
function ficoTxt(num, txt){ return num != null ? String(num) : (txt || ''); }
function visibles(){
  const q = sinAcentos(BUSCA);
  // Si lo que escribieron trae números, se compara también contra SOLO los dígitos.
  // El teléfono se guarda como "(407) 484-1680": sin esto, buscar 4074841680 o
  // 484-1680 no encontraba nada, y es la forma natural de pegar un número.
  // El +1 se quita: pegando del CRM viene "+1 (689) 231-7554" y guardado está sin el 1.
  const qd = BUSCA.replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
  return deLaTienda().filter(a => {
    // Veredicto y etapa son ejes distintos: se cruzan, no se pisan.
    if (VER === 'sinrevisar' && a.veredicto) return false;
    if (['aprobado','posible','negado'].includes(VER) && a.veredicto !== VER) return false;
    if (SOLO_HOY && !vieneHoy(a)) return false;
    if (FILTRO === 'hoy' && !(a.urgencia === 'hoy' || a.urgencia === '2-3dias')) return false;
    if (['trabajando','esperando','cerrada'].includes(FILTRO) && a.estado !== FILTRO) return false;
    if (FILTRO === 'sincopia' && !(a.copia_estado && a.copia_estado !== 'enviada')) return false;
    // FICO: los botones son "de tanto para arriba"; los dos recuadros, un rango.
    // "Sin revisar" son las que nadie ha mirado todavía — no las de puntaje bajo.
    // Se filtra por el MEJOR de los dos puntajes: si el co-signer tiene 700 y el
    // signer 540, esa aplicación sí califica para "700+", que es lo que uno busca
    // al preguntarse cuáles pueden aprobar.
    const fmax = mejorFico(a);
    // "Sin revisar" = nadie miró el crédito. Un "no hit" SÍ lo miraron, así que sale
    // de ahí y tiene su propio botón: si no, quedaba escondido en todos los filtros.
    if (FICO === 'sin' && ficoRevisado(a)) return false;
    if (FICO === 'nohit' && !ficoSinPuntaje(a)) return false;
    if (FICO !== 'todas' && FICO !== 'sin' && FICO !== 'nohit'){
      if (fmax == null || fmax < Number(FICO)) return false;
    }
    if (FICO_MIN != null && (fmax == null || fmax < FICO_MIN)) return false;
    if (FICO_MAX != null && (fmax == null || fmax > FICO_MAX)) return false;
    if (!q) return true;
    if (qd.length >= 3){
      const digitos = [a.cliente_telefono, a.deal_number, a.codigo].map(x => String(x || '').replace(/\D/g, ''));
      if (digitos.some(d => d && d.includes(qd))) return true;
    }
    if (!q) return false;
    return [a.cliente_nombre, a.cliente_telefono, a.vendedor_nombre, a.vehiculo_especifico,
            a.notas, a.deal_number, a.codigo, a.fico_txt, a.fico_co_txt,
            ...(a.bitacora || []).map(n => n.texto)]
      .some(x => sinAcentos(x).includes(q));
  });
}


/* ── KPIs ─────────────────────────────────────────────────────────────────────
   Para ver qué está pasando cada día sin abrir 25 tarjetas. Todo se calcula de lo
   que ya está cargado — no hay una consulta aparte que se pueda desincronizar. */
let KPI_PER = 'hoy', KPI_ON = false;

function kpiRango(p){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const d = n => { const x = new Date(hoy); x.setDate(x.getDate()+n); return x; };
  if (p === 'hoy')    return [hoy, new Date(8.64e15), 'Hoy'];
  if (p === 'ayer')   return [d(-1), hoy, 'Ayer'];
  if (p === '7')      return [d(-6), new Date(8.64e15), 'Últimos 7 días'];
  if (p === 'mes')    return [new Date(hoy.getFullYear(), hoy.getMonth(), 1), new Date(8.64e15), 'Este mes'];
  return [new Date(0), new Date(8.64e15), 'Todo'];
}
/* Buscar sin tropezar con tildes ni mayúsculas: en esta lista hay "Javier Nuñez",
   "Núñez" y "NUNEZ", y quien busca no sabe cuál escribió el vendedor. */
const sinAcentos = t => String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const enRango = (iso, a, b) => { if (!iso) return false; const t = new Date(iso); return t >= a && t < b; };

function verKpis(){
  KPI_ON = !KPI_ON;
  document.getElementById('chip-kpis').classList.toggle('on', KPI_ON);
  document.getElementById('kpi-vista').style.display = KPI_ON ? '' : 'none';
  ['lista','kpis'].forEach(id => { const e = document.getElementById(id); if (e) e.style.display = KPI_ON ? 'none' : ''; });
  // Los filtros y el buscador son de la lista: en la vista de KPIs no pintan nada.
  ['filtros-caja'].forEach(id => { const e = document.getElementById(id); if (e) e.style.display = KPI_ON ? 'none' : ''; });
  document.querySelectorAll('.filtros-tog').forEach(b => { b.style.display = KPI_ON ? 'none' : ''; });
  pintar();
}

function pintarKpis(){
  const [a, b, etq] = kpiRango(KPI_PER);
  const base = deLaTienda();                       // respeta tienda y vendedor elegidos
  const recibidas = base.filter(x => enRango(x.created_at, a, b));
  const revisadas = base.filter(x => enRango(x.veredicto_at, a, b));
  const apro = revisadas.filter(x => x.veredicto === 'aprobado');
  const nega = revisadas.filter(x => x.veredicto === 'negado');
  const posi = revisadas.filter(x => x.veredicto === 'posible');
  const sinRev = base.filter(x => !x.veredicto);
  const masVieja = sinRev.slice().sort((x,y) => new Date(x.created_at) - new Date(y.created_at))[0];
  const tasa = revisadas.length ? Math.round(apro.length / revisadas.length * 100) : null;

  // Cuánto tardan en revisar: la mediana aguanta mejor un caso raro que el promedio.
  const horas = base.filter(x => x.veredicto_at)
    .map(x => (new Date(x.veredicto_at) - new Date(x.created_at)) / 36e5).sort((p,q) => p - q);
  const med = horas.length ? horas[Math.floor(horas.length/2)] : null;
  const tiempo = med === null ? '—' : (med < 1 ? Math.round(med*60) + ' min' : (med < 48 ? med.toFixed(1) + ' h' : (med/24).toFixed(1) + ' días'));

  const dinero = arr => { const v = arr.map(x => Number(x.down_hoy)||0).filter(Boolean); return v.length ? '$' + Math.round(v.reduce((s,n)=>s+n,0)/v.length).toLocaleString('en-US') : '—'; };

  // Tabla por vendedor
  const porV = {};
  base.forEach(x => {
    const e = (x.vendedor_email||'').toLowerCase(); if (!e) return;
    const o = porV[e] = porV[e] || { nombre: x.vendedor_nombre, tot:0, per:0, apro:0, nega:0, rev:0, sin:0 };
    o.tot++;
    if (enRango(x.created_at, a, b)) o.per++;
    if (x.veredicto) { o.rev++; if (x.veredicto==='aprobado') o.apro++; if (x.veredicto==='negado') o.nega++; }
    else o.sin++;
  });
  const filas = Object.values(porV).sort((p,q) => q.per - p.per || q.tot - p.tot);
  const lider = filas.filter(f => f.per > 0)[0];

  const tarjeta = (n, l, color, sub) =>

      ${tarjeta(sinRev.length, 'Sin revisar', sinRev.length?'var(--yellow)':'var(--green)', sinRev.length?'acumuladas':'al día ✓')}
      ${tarjeta(masVieja ? cuandoRelativo(masVieja.created_at).replace('hace ','') : '—', 'La más vieja esperando', null, masVieja ? masVieja.cliente_nombre : '')}

      <div class="tabla-scroll">
        <table class="tabla">
          <thead><tr><th>Vendedor</th><th>${esc(etq)}</th><th>Total</th><th>Aprob.</th><th>Neg.</th><th>Sin revisar</th><th>%</th></tr></thead>
          <tbody>${filas.map(f => `<tr>
            <td class="nom2">${esc(f.nombre)}</td>
            <td><b>${f.per||'—'}</b></td>
            <td>${f.tot}</td>
            <td style="color:${f.apro?'var(--green)':'var(--gray-300)'}">${f.apro||'—'}</td>
            <td style="color:${f.nega?'var(--red)':'var(--gray-300)'}">${f.nega||'—'}</td>
            <td style="color:${f.sin?'var(--yellow)':'var(--gray-300)'}">${f.sin||'—'}</td>
            <td>${f.rev?Math.round(f.apro/f.rev*100)+'%':'—'}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>

    <div class="sect2">
      <h3>Cómo vienen</h3>
      <div class="barras">
        ${[['hoy','Compran hoy','var(--red)'],['2-3dias','En 2–3 días','var(--yellow)'],['semana','Esta semana','var(--blue)'],['mes','Este mes','var(--gray-400)'],['sin_fecha','Sin fecha','var(--gray-300)']]
          .map(([v,t,c]) => { const n = recibidas.filter(x=>x.urgencia===v).length;
            const pct = recibidas.length ? Math.round(n/recibidas.length*100) : 0;
            return `<div class="barra"><div class="barra-t">${t}</div>
              <div class="barra-p"><div style="width:${pct}%;background:${c}"></div></div>
              <div class="barra-n">${n}</div></div>`; }).join('')}
      </div>
      <div class="kpi-hint" style="margin-top:12px">
        Down promedio de las de ${etq.toLowerCase()}: <b>${dinero(recibidas)}</b> ·
        con trade-in: <b>${recibidas.filter(x=>x.trade_in&&x.trade_in!=='no').length}</b> ·
        transfieren placa: <b>${recibidas.filter(x=>x.placa==='transferencia').length}</b>
      </div>
    </div>

    <div class="sect2">
      <h3>Crédito</h3>
      ${(() => {
        const con = base.filter(x => mejorFico(x) != null);
        const nohit = base.filter(ficoSinPuntaje).length;   // buró sin historial: revisadas, pero sin número
        const faltan = base.filter(x => !ficoRevisado(x)).length;
        if (!con.length && !nohit) return `<div class="kpi-hint">Todavía nadie ha anotado un FICO. En cuanto Finance empiece a ponerlos, aquí sale si el puntaje predice la aprobación.</div>`;
        const prom = con.length ? Math.round(con.reduce((t,x) => t + mejorFico(x), 0) / con.length) : null;
        const conCo = con.filter(x => x.fico_co != null).length;
        /* Lo que importa no es el promedio sino si el puntaje separa aprobadas de
           negadas. Por eso cada banda muestra su tasa: si 700+ aprueba 80% y 550
           aprueba 20%, el FICO sirve para priorizar; si dan parecido, no. */
        const bandas = [['700 o más', x=>x>=700, 'var(--green)'], ['650–699', x=>x>=650&&x<700, '#22c55e'],
                        ['600–649', x=>x>=600&&x<650, 'var(--yellow)'], ['550–599', x=>x>=550&&x<600, '#f97316'],
                        ['menos de 550', x=>x<550, 'var(--red)']];
        return `
        <div class="kpi-hint">
          <b>${con.length}</b> de ${base.length} tienen puntaje${prom ? ` · promedio <b>${prom}</b>` : ''} ·
          faltan por revisar <b>${faltan}</b>${nohit ? ` · <b>${nohit}</b> sin historial de crédito` : ''}${conCo ? ` · <b>${conCo}</b> con co-signer` : ''}
        </div>

          <thead><tr><th>Puntaje</th><th>Cuántas</th><th>Aprobadas</th><th>Negadas</th><th>Tasa</th></tr></thead>
          <tbody>${bandas.map(([t,f,c]) => {
            const g = con.filter(x => f(mejorFico(x)));
            if (!g.length) return '';
            const ap = g.filter(x => x.veredicto === 'aprobado').length;
            const ne = g.filter(x => x.veredicto === 'negado').length;
            const rev = ap + ne;
            return `<tr>
              <td class="nom2"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};margin-right:7px"></span>${t}</td>
              <td><b>${g.length}</b></td>
              <td style="color:${ap?'var(--green)':'var(--gray-300)'}">${ap||'—'}</td>
              <td style="color:${ne?'var(--red)':'var(--gray-300)'}">${ne||'—'}</td>
              <td>${rev ? Math.round(ap/rev*100)+'%' : '—'}</td></tr>`;
          }).join('')}</tbody>
        </table></div>`;
      })()}
    </div>

    <div class="sect2">
      <h3>Por tienda</h3>
      <div class="tabla-scroll"><table class="tabla">
        <thead><tr><th>Tienda</th><th>${esc(etq)}</th><th>Total</th><th>Sin revisar</th></tr></thead>
        <tbody>${['Orlando','Kissimmee'].map(t => {
          const tt = TODAS.filter(x => x.location === t);
          return `<tr><td class="nom2">${t}</td><td><b>${tt.filter(x=>enRango(x.created_at,a,b)).length||'—'}</b></td><td>${tt.length}</td><td>${tt.filter(x=>!x.veredicto).length||'—'}</td></tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>`;
}

function pintar(){
  pintarMenus();
  if (KPI_ON){ pintarKpis(); return; }
  const v = visibles();
  const base = deLaTienda();
  bandaAlerta(base);
  const hoyISO = new Date().toLocaleDateString('en-CA');
  const deHoy = base.filter(a => String(a.created_at).slice(0,10) === hoyISO).length;
  const urgentes = base.filter(a => a.urgencia === 'hoy' || a.urgencia === '2-3dias').length;
  const sinRevisar = base.filter(a => !a.veredicto).length;
  const cl = document.getElementById('chip-limpiar');
  // Cuántos filtros hay puestos. Sin el número uno no sabe por qué ve tan poco.
  const nFiltros = [VER !== 'todas', FILTRO !== 'todas', LOC !== 'todas', VEND !== 'todos',
                    !!BUSCA, SOLO_HOY, FICO !== 'todas', FICO_MIN != null || FICO_MAX != null].filter(Boolean).length;
  if (cl){
    cl.style.display = nFiltros ? '' : 'none';
    cl.textContent = nFiltros === 1 ? 'Quitar filtro' : `Quitar ${nFiltros} filtros`;
  }
  document.getElementById('kpis').innerHTML =
    `<div class="kpi"><div class="n">${base.length}</div><div class="l">${LOC === 'todas' ? 'En total' : (LOC === 'sin' ? 'Sin tienda' : esc(LOC))}</div></div>
     <div class="kpi"><div class="n">${deHoy}</div><div class="l">Entraron hoy</div></div>
     <div class="kpi"><div class="n" style="color:var(--red)">${urgentes}</div><div class="l">Compran ya</div></div>
     <div class="kpi"><div class="n" style="color:${sinRevisar?'var(--yellow)':'inherit'}">${sinRevisar}</div><div class="l">Sin revisar</div></div>`;
  document.getElementById('sub').textContent =
    TODAS.length ? `${v.length} de ${base.length}${LOC !== 'todas' ? ' en ' + (LOC === 'sin' ? 'sin tienda' : LOC) : ''}${VEND !== 'todos' ? ' · ' + ((TODAS.find(a=>(a.vendedor_email||'').toLowerCase()===VEND)||{}).vendedor_nombre || '') : ''} · la última ${cuandoRelativo(TODAS[0].created_at)}`
                 : 'Todavía no hay ninguna';
  const sub = document.getElementById('sub');
  if (sub && ULTIMA){
    const seg = Math.round((Date.now() - ULTIMA)/1000);
    sub.textContent += seg < 90 ? ' · al día' : ` · visto hace ${Math.round(seg/60)} min`;
  }

  v.sort((x,y) => quema(y) - quema(x));
  document.getElementById('lista').innerHTML = v.length ? v.map(fila).join('')
    : `<div class="vacio">${TODAS.length ? (LOC === 'todas' ? 'Nada con ese filtro.' : 'Nada con ese filtro en ' + esc(LOC === 'sin' ? 'aplicaciones sin tienda' : LOC) + '.') : 'Todavía no hay aplicaciones.<br>Cuando un vendedor mande la primera, aparece aquí sola.'}</div>`;
}

/* Lo primero que se ve al abrir. Si hay algo quemandose, que te encuentre a ti. */
function bandaAlerta(base){
  const cont = document.getElementById('banda'); if (!cont) return;
  const hoy = base.filter(vieneHoy);
  const viejas = base.filter(a => !a.veredicto && horasEsperando(a) > 24 && (a.urgencia === 'hoy' || a.urgencia === '2-3dias'));
  if (!hoy.length && !viejas.length){ cont.innerHTML = ''; return; }
  const partes = [];
  if (viejas.length) partes.push(`<button class="banda-b rojo" onclick="VER='sinrevisar';FILTRO='hoy';ABIERTA=null;pintar()">
      <b>${viejas.length}</b> urgente${viejas.length>1?'s':''} sin revisar · la más vieja lleva <b>${Math.round(Math.max(...viejas.map(horasEsperando)))} h</b></button>`);
  if (hoy.length) partes.push(`<button class="banda-b azul" onclick="VER='todas';FILTRO='todas';BUSCA='';document.getElementById('buscar').value='';ABIERTA=null;SOLO_HOY=true;pintar()">
      <b>${hoy.length}</b> cliente${hoy.length>1?'s vienen':' viene'} hoy al dealer</button>`);
  cont.innerHTML = partes.join('');
}

/* Las notas son INTERNAS: se ven aquí, nunca en el link que se le pasa a Finance
   por mensaje. Ese link no tiene clave y podría terminar donde el cliente. */
function bitacora(a){
  const b = Array.isArray(a.bitacora) ? a.bitacora : [];
  const items = b.map(n => n.tipo === 'etapa'
    ? `<div class="bit-etapa">↳ <b>${esc(n.quien)}</b> ${esc(n.texto)} · ${esc(bitCuando(n.cuando))}</div>`
    : n.tipo === 'veredicto'
    ? `<div class="bit-etapa">✓ <b>${esc(n.quien)}</b> ${esc(n.texto)} · ${esc(bitCuando(n.cuando))}</div>`
    : `<div class="bit-item">
      <div class="bit-ini">${esc(bitIniciales(n.quien))}</div>
      <div class="bit-cuerpo">
        <div class="bit-meta"><b>${esc(n.quien || 'Finance')}</b> · ${esc(bitCuando(n.cuando))}</div>
        <div class="bit-texto">${esc(n.texto)}</div>
      </div>
    </div>`).join('');
  return `<div class="bit">
    <h4>Notas de Finance ${b.filter(x=>(x.tipo!=='etapa'&&x.tipo!=='veredicto')).length ? `<span class="n">${b.filter(x=>(x.tipo!=='etapa'&&x.tipo!=='veredicto')).length}</span>` : ''}</h4>
    ${items || '<div class="bit-vacia">Todavía nadie ha escrito nada.</div>'}

}

async function agregarNota(id){
  const ta = document.getElementById('nota-' + id);

  if (!texto) return;
  const quien = QUIEN;
  const btn = ta.parentElement.querySelector('button');

  const a = TODAS.find(x => x.id === id);

  a.bitacora = antes.concat([{ quien, texto, cuando: new Date().toISOString() }]);
  ta.value = ''; pintar();
  try{

/* El puntaje de crédito lo escribe quien revisa la aplicación. Se guarda con su
   nombre y la hora, igual que el veredicto: sirve para filtrar después y para saber
   quién lo consultó. Vacío = todavía no lo han mirado. */
async function guardarFico(id){
  const a = TODAS.find(x => x.id === id);
  /* Acepta el puntaje o una palabra. Hay clientes sin historial de crédito — el buró
     no devuelve número, devuelve "no hit" — y antes no había forma de anotarlo: quedaba
     vacío, igual que si nadie lo hubiera mirado. Son dos cosas distintas.
     Si lo escrito es un puntaje válido se guarda como número, para que los filtros por
     rango y el promedio sigan funcionando; si no, se guarda como texto aparte. */
  const leer = (pre) => {
    const inp = document.getElementById(pre + '-' + id);
    const txt = (inp.value || '').trim();
    inp.classList.remove('invalid');
    if (txt === '') return { ok: true, v: null, t: null };
    if (/^\d+$/.test(txt)){
      const n = parseInt(txt, 10);
      if (n < 300 || n > 900){ inp.classList.add('invalid'); return { ok: false, num: true }; }
      return { ok: true, v: n, t: null };
    }
    if (txt.length > 24){ inp.classList.add('invalid'); return { ok: false }; }
    return { ok: true, v: null, t: txt };
  };
  const s = leer('fico'), c = leer('ficoco');
  if (!s.ok || !c.ok) {
    alert((s.num || c.num) ? 'Si escribes un número, el FICO va de 300 a 900.\nSi no hay puntaje, escribe "no hit".'
                           : 'Eso es muy largo. Escribe el puntaje o algo corto como "no hit".');
    return;
  }
  const antes = { f: a.fico, fc: a.fico_co, ft: a.fico_txt, fct: a.fico_co_txt, por: a.fico_por, at: a.fico_at };
  if (s.v === antes.f && c.v === antes.fc && (s.t||null) === (antes.ft||null) && (c.t||null) === (antes.fct||null)) return;
  const hay = s.v !== null || c.v !== null || s.t !== null || c.t !== null;
  a.fico = s.v; a.fico_co = c.v; a.fico_txt = s.t; a.fico_co_txt = c.t;
  a.fico_por = hay ? QUIEN : null;
  a.fico_at  = hay ? new Date().toISOString() : null;
  pintar();
  try{
    const r = await rpc('ar_oa_fico', { p_codigo: CODIGO, p_id: id, p_fico: s.v, p_fico_co: c.v,
                                        p_fico_txt: s.t, p_fico_co_txt: c.t });
    if (!Array.isArray(r) || !r.length) throw new Error('no se guardó');
    const el = document.querySelector('.fico-ok');
    if (el) { el.textContent = hay ? 'Guardado ✓' : 'Quitado ✓'; setTimeout(() => { if (el.isConnected) el.textContent = ''; }, 2200); }
  }catch(e){
    a.fico = antes.f; a.fico_co = antes.fc; a.fico_txt = antes.ft; a.fico_co_txt = antes.fct;
    a.fico_por = antes.por; a.fico_at = antes.at; pintar();
    alert('No se pudo guardar el FICO. Revisa el internet.');
  }
}

/* ── Documentos del cliente ───────────────────────────────────────────────────
   Los archivos viven en un guardado privado; el navegador nunca los toca directo.
   Para subir se le pasan a una función del servidor junto con la clave de quien
   está adentro, y para abrirlos se pide un enlace que dura 10 minutos. Son
   identificaciones y estados de cuenta de gente real: no pueden quedar en una
   dirección que cualquiera pueda adivinar. */
const FN_DOCS = SUPA_URL + '/functions/v1/documentos';
/* Mantener al día la tarjeta de Discord. Se dispara sin esperarla a propósito: si el
   canal no responde, la nota o el veredicto YA quedaron guardados y nadie se queda
   mirando una rueda girar por un aviso. */
function avisarDiscord(id){
  fetch(SUPA_URL + '/functions/v1/discord-estado', {
    method:'POST', headers: SUPA_H, body: JSON.stringify({ codigo: CODIGO, id })
  }).catch(() => {});
}
const MAX_DOC = 15 * 1024 * 1024;

function pesoArchivo(b){
  b = Number(b) || 0;
  return b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b/1024) + ' KB' : (b/1048576).toFixed(1) + ' MB';
}
async function fnDocs(cuerpo){
  const r = await fetch(FN_DOCS, { method:'POST', headers: SUPA_H, body: JSON.stringify(cuerpo) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('http ' + r.status));
  return j;
}
function avisoDoc(id, txt, seQuita){
  const c = document.querySelector('#docs-' + id + ' .doc-ok');
  if (!c) return;
  c.textContent = txt;
  if (seQuita) setTimeout(() => { if (c.isConnected) c.textContent = ''; }, 2500);
}
async function subirDocs(id, input){
  const files = [...(input.files || [])];
  input.value = '';
  if (!files.length) return;
  const a = TODAS.find(x => x.id === id);
  const grandes = files.filter(f => f.size > MAX_DOC);
  if (grandes.length){
    alert('Estos pesan más de 15 MB y no se pueden subir:\n' + grandes.map(f => f.name).join('\n'));
    if (grandes.length === files.length) return;
  }
  const buenos = files.filter(f => f.size <= MAX_DOC);
  let n = 0;
  for (const f of buenos){
    avisoDoc(id, `Subiendo ${++n} de ${buenos.length}…`);
    try{
      // Se manda en base64 porque el cuerpo del mensaje es texto. Ocupa un tercio más,
      // por eso el tope de 15 MB se revisa ANTES de convertirlo.
      const b64 = await new Promise((ok, mal) => {
        const fr = new FileReader();
        fr.onload = () => ok(String(fr.result).split(',')[1] || '');
        fr.onerror = () => mal(new Error('no se pudo leer'));
        fr.readAsDataURL(f);
      });
      const j = await fnDocs({ accion:'subir', codigo: CODIGO, id, nombre: f.name,
                               tipo: f.type || 'application/octet-stream', datos: b64, quien: QUIEN });
      a.docs = (a.docs || []).concat([j.doc]);
      pintar();
    }catch(e){
      avisoDoc(id, '', false);
      alert('No se pudo subir "' + f.name + '".' + (e.message === 'muy_grande' ? ' Pesa demasiado.' : ' Revisa el internet.'));
      return;
    }
  }
  avisoDoc(id, buenos.length === 1 ? 'Subido ✓' : buenos.length + ' subidos ✓', true);
}
async function verDoc(id, ruta, btn){
  const antes = btn.textContent;
  btn.textContent = 'Abriendo…';
  try{
    const j = await fnDocs({ accion:'ver', codigo: CODIGO, id, ruta });
    window.open(j.url, '_blank', 'noopener');
  }catch(e){ alert('No se pudo abrir el documento.'); }
  btn.textContent = antes;
}
async function borrarDoc(id, docId, ruta){
  const a = TODAS.find(x => x.id === id);
  const d = (a.docs || []).find(x => x.id === docId);
  if (!confirm('¿Quitar "' + (d ? d.nombre : 'este documento') + '"? No se puede deshacer.')) return;
  const antes = a.docs;
  a.docs = (a.docs || []).filter(x => x.id !== docId); pintar();
  try{ await fnDocs({ accion:'borrar', codigo: CODIGO, id, docId, ruta }); avisoDoc(id, 'Quitado ✓', true); }
  catch(e){ a.docs = antes; pintar(); alert('No se pudo quitar el documento.'); }
}

/* Al abrir: si viene del menú del CRM, el propio CRM ya dice quién es.
   Manager -> el panel completo, sin código. Vendedor -> solo lo suyo. */
(async function(){
  const q = new URLSearchParams(location.search);

  // 1) ¿Viene con un pase? Se canjea una sola vez y se limpia de la dirección.
  const pase = (q.get('p') || '').trim();
  if (pase){
    document.getElementById('puerta').style.display = 'none';
    let s = null;
    try{ s = (await rpc('ar_oa_pase_usar', { p_token: pase }) || [])[0]; }catch(e){}
    // La dirección queda limpia pase lo que pase: el pase no se queda a la vista.
    history.replaceState(null, '', location.pathname);
    if (!s){
      document.getElementById('puerta').style.display = '';
      errorPuerta('Ese pase ya se usó o venció. Vuelve a darle a "Abrir fuera" desde el CRM.');
      return;
    }
    try{ localStorage.setItem(SESION_KEY, JSON.stringify(s)); }catch(e){}
    return arrancarSesion(s);
  }

  // 2) ¿Ya hay sesión guardada en este navegador?
  let g2 = null; try{ g2 = JSON.parse(localStorage.getItem(SESION_KEY) || 'null'); }catch(e){}
  if (g2 && g2.nombre){ document.getElementById('puerta').style.display = 'none'; return arrancarSesion(g2); }

  const nombre = (q.get('name') || q.get('user') || '').trim();
  const email  = (q.get('email') || '').trim().toLowerCase();
  if (nombre || email){
    document.getElementById('puerta').style.display = 'none';
    let quien = null;
    try{ quien = await rpc('ar_oa_quien_crm', { p_email: email, p_nombre: nombre }); }catch(e){}
    if (quien){
      // Es manager: entra al panel completo con su nombre, sin escribir código.
      CODIGO = ''; QUIEN = quien; CRM = { nombre, email };
      document.getElementById('yo').textContent = quien;
      // El propio usuario del CRM autoriza a escribir. Todo lo que haga —veredictos,
      // notas, etapas— queda firmado con su nombre, igual que si hubiera entrado con
      // su código. Ya no hay candado de solo lectura.
      CODIGO = 'crm:' + email + '|' + nombre;
      const cs2 = document.getElementById('chip-salir'); if (cs2) cs2.style.display = 'none';
      document.getElementById('panel').style.display = '';
      arrancarRefresco();
      await cargar();
      return;
    }
    if (email){ await verMias(nombre, email); return; }
    document.getElementById('puerta').style.display = '';
    errorPuerta('El CRM no mandó tu correo. Entra con tu código.');
    return;
  }
  let g = ''; try{ g = localStorage.getItem(GUARDA) || ''; }catch(e){}
  if (g){ document.getElementById('codigo').value = g; entrar(); }
})();
</script>
</body>
</html>
