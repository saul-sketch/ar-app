<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Online Application — Auto Republic</title>
<link rel="stylesheet" href="/ar-app/estilo.css">
<style>
  .dato{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--gray-200);align-items:baseline;}
  .dato:last-child{border-bottom:0;}
  .dato .k{font-size:13px;color:var(--gray-500);flex:1;line-height:1.4;}
  .dato .v{font-size:15px;font-weight:700;text-align:right;color:var(--gray-900);}
  .dato .v.muted{font-weight:500;color:var(--gray-400);}
  .cab{background:var(--gray-100);border-radius:12px;padding:16px;margin-bottom:18px;}
  .cab .nombre{font-size:20px;font-weight:700;letter-spacing:-.3px;}
  .cab .tel{font-size:16px;color:var(--blue);font-weight:600;margin-top:3px;text-decoration:none;display:inline-block;}
  .cab .meta{font-size:12px;color:var(--gray-500);margin-top:8px;}
  .notas{background:#fffbeb;border-left:3px solid var(--yellow);border-radius:8px;padding:14px;font-size:14px;line-height:1.55;color:var(--gray-900);white-space:pre-wrap;}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>Online Application</h1>
      <div class="subtitle">Finance Handoff · Auto Republic</div>
    </div>
  </div>
  <div class="body" id="out"><div class="cargando">Cargando…</div></div>
</div>
<script src="/ar-app/shared.js"></script>
<script src="/ar-app/ver.js"></script>
</body>
</html>
